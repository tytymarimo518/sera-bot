name: ブログ記事の自動更新

on:
  schedule:
    # 毎日 6時・12時・18時・0時（JST）= UTC 21/3/9/15時 に実行
    - cron: "0 21,3,9,15 * * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存関係のインストール
        run: pip install -r requirements.txt

      - name: ブログ記事を取得・更新
        env:
          BLOG_URL: ${{ vars.BLOG_URL || 'https://cabinattendant.blog/' }}
        run: python scraper.py

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "sera-bot[bot]"
          git config user.email "sera-bot[bot]@users.noreply.github.com"
          git add data/knowledge_base.json
          if git diff --cached --quiet; then
            echo "変更なし：新着記事はありませんでした"
          else
            git commit -m "chore: ナレッジベースを更新 $(date '+%Y-%m-%d %H:%M JST' -d '+9 hours')"
            git push
          fi
